name: Sign & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Sign (unlisted) on AMO
        run: pnpm sign:ci
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

      - name: Rename signed xpi to predictable name
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SIGNED=$(ls web-ext-artifacts/*.xpi | head -1)
          cp "$SIGNED" "web-ext-artifacts/markdown_renderer-${VERSION}.xpi"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: web-ext-artifacts/markdown_renderer-*.xpi
